<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- タイトル・文言は options.ts が _locales（data-i18n のキー）から差し込む -->
    <title></title>
    <!--
      見た目の決まり（確認ダイアログ src/ui/dialog/styles.ts と同じ世界にする）：
      - 地は #0D1117 の暗い色、文字は白。設定画面は背後に透かすものが無いので、半透明やぼかしは使わない
      - 書体は BIZ UDP ゴシック。ドメイン・アドレスなどを入力する欄は等幅の書体
        （外部からフォントは読み込まない。端末に入っている書体だけを使う）
      - 意味を持つ色は2つだけ。黄色は「知らせ・注意」、赤は「削除など取り消せない操作」
      - 枠で囲んだ箱を並べず、細い区切り線と「見出しを左、内容を右」の並びで見せる
    -->
    <style>
      :root {
        --ground: #0d1117;
        --ink: #ffffff;
        --ink-soft: rgba(255, 255, 255, 0.72);
        --rule: rgba(255, 255, 255, 0.16);
        --wash: rgba(255, 255, 255, 0.06);
        --edge: rgba(255, 255, 255, 0.3);
        --notice: #f9f1a5;
        --danger: #ff9a90;
        --ui: 'BIZ UDPGothic', 'Hiragino Sans', 'Yu Gothic UI', Meiryo, sans-serif;
        --data: 'Cascadia Mono', Consolas, 'SF Mono', Menlo, 'BIZ UDGothic', monospace;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scrollbar-color: rgba(255, 255, 255, 0.4) transparent;
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font: 14px/1.7 var(--ui);
        font-feature-settings: 'palt';
      }
      ::selection {
        background: rgba(255, 255, 255, 0.28);
        color: #fff;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 40px 32px 120px;
      }
      h1 {
        margin: 0 0 28px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      /* 知らせ（インストール直後の再読み込み、送信取り消しの案内） */
      .notice {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        max-width: 62ch;
        margin: 0;
        color: var(--notice);
      }
      .notice svg {
        flex: none;
        width: 16px;
        height: 16px;
        margin-top: 4px;
      }
      .closing {
        margin-top: 28px;
        padding-top: 28px;
        border-top: 1px solid var(--rule);
      }
      .closing .notice {
        color: var(--ink-soft);
      }

      /* 見出しを左の列、内容を右の列に置く */
      section {
        display: grid;
        grid-template-columns: 11em minmax(0, 1fr);
        column-gap: 32px;
        margin-top: 28px;
        padding-top: 28px;
        border-top: 1px solid var(--rule);
      }
      h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
      }
      .content > :first-child {
        margin-top: 0;
      }
      @media (max-width: 640px) {
        main {
          padding: 28px 20px 120px;
        }
        section {
          grid-template-columns: minmax(0, 1fr);
          row-gap: 12px;
        }
      }

      label.field {
        display: block;
        margin-top: 20px;
        font-weight: 700;
      }
      textarea {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 8px 10px;
        border: 1px solid var(--edge);
        border-radius: 4px;
        background: var(--wash);
        color: var(--ink);
        font: 13px/1.7 var(--data);
        resize: vertical;
        transition: border-color 120ms ease-out;
      }
      textarea:hover {
        border-color: rgba(255, 255, 255, 0.5);
      }
      .help {
        max-width: 62ch;
        margin: 6px 0 0;
        color: var(--ink-soft);
        font-size: 13px;
      }
      label.check {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 14px -8px 0;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      label.check:hover {
        background: var(--wash);
      }
      label.check:has(input:disabled) {
        color: var(--ink-soft);
        cursor: not-allowed;
      }
      input[type='checkbox'] {
        flex: none;
        width: 16px;
        height: 16px;
        margin: 4px 0 0;
        accent-color: #ffffff;
        cursor: inherit;
      }
      #warningLevels label.check {
        margin-top: 2px;
      }
      #warningLevels label.check:first-child {
        margin-top: 10px;
      }
      select {
        display: block;
        margin-top: 6px;
        min-height: 36px;
        padding: 0 10px;
        border: 1px solid var(--edge);
        border-radius: 4px;
        background: var(--ground);
        color: var(--ink);
        font: inherit;
        font-weight: 400;
      }
      .state {
        margin: 14px 0 0;
        font-variant-numeric: tabular-nums;
      }

      button {
        min-height: 36px;
        padding: 0 16px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 4px;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 120ms ease-out;
      }
      button:hover {
        background: var(--wash);
      }
      button:disabled {
        border-color: transparent;
        background: rgba(255, 255, 255, 0.14);
        color: rgba(255, 255, 255, 0.45);
        cursor: not-allowed;
      }
      /* 主となる操作は白の塗り（色ではなく明るさで目立たせる） */
      button.primary {
        min-width: 96px;
        border-color: #ffffff;
        background: #ffffff;
        color: var(--ground);
      }
      button.primary:hover {
        background: rgba(255, 255, 255, 0.86);
      }
      button.danger {
        border-color: var(--danger);
        color: var(--danger);
      }
      .content > button {
        margin-top: 12px;
      }
      button:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      input:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }

      /* 保存の操作は、どこまでスクロールしていても届くように下に固定する */
      .bar {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        border-top: 1px solid var(--rule);
        background: var(--ground);
      }
      .bar-inner {
        display: flex;
        align-items: center;
        gap: 16px;
        max-width: 860px;
        margin: 0 auto;
        padding: 12px 32px;
      }
      .status {
        flex: 1;
        min-width: 0;
        min-height: 1.7em;
        color: var(--ink-soft);
        font-size: 13px;
      }
      .status.error {
        color: var(--danger);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 data-i18n="optionsTitle"></h1>

      <p class="notice" role="note">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1.9 14.6 13.6H1.4L8 1.9Z" fill="#f9f1a5" />
          <path
            d="M8 6.3v3.4M8 11.5v.1"
            fill="none"
            stroke="#0d1117"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
        <span data-i18n="optionsReloadTip"></span>
      </p>

      <section>
        <h2 data-i18n="optionsSectionRecipients"></h2>
        <div class="content">
          <p class="help" data-i18n="optionsOnePerLine"></p>

          <label class="field">
            <span data-i18n="optionsInternalDomains"></span>
            <textarea id="internalDomains" rows="3" spellcheck="false"></textarea>
          </label>
          <p class="help" data-i18n="optionsInternalDomainsHelp"></p>
          <label class="field">
            <span data-i18n="optionsInternalAddresses"></span>
            <textarea id="internalAddresses" rows="3" spellcheck="false"></textarea>
          </label>

          <label class="field">
            <span data-i18n="optionsCautionDomains"></span>
            <textarea id="cautionDomains" rows="3" spellcheck="false"></textarea>
          </label>
          <label class="field">
            <span data-i18n="optionsCautionAddresses"></span>
            <textarea id="cautionAddresses" rows="3" spellcheck="false"></textarea>
          </label>
          <p class="help" data-i18n="optionsCautionHelp"></p>

          <label class="check">
            <input id="skipConfirmationEnabled" type="checkbox" />
            <span data-i18n="optionsSkipEnabled"></span>
          </label>
          <label class="field">
            <span data-i18n="optionsSkipAddresses"></span>
            <textarea id="skipAddresses" rows="3" spellcheck="false"></textarea>
          </label>
          <p class="help" data-i18n="optionsSkipHelp"></p>

          <p class="help" data-i18n="optionsFreemailNote"></p>
        </div>
      </section>

      <section>
        <h2 data-i18n="optionsSectionAttachment"></h2>
        <div class="content">
          <label class="field">
            <span data-i18n="optionsAttachmentKeywords"></span>
            <textarea id="attachmentKeywords" rows="8" spellcheck="false"></textarea>
          </label>
          <p class="help" data-i18n="optionsOnePerLine"></p>
          <label class="check">
            <input id="treatDriveLinksAsAttachment" type="checkbox" />
            <span data-i18n="optionsDriveLinks"></span>
          </label>
        </div>
      </section>

      <section>
        <h2 data-i18n="optionsSectionWording"></h2>
        <div class="content">
          <label class="field">
            <span data-i18n="optionsTypoDictionary"></span>
            <textarea id="typoDictionary" rows="5" spellcheck="false"></textarea>
          </label>
          <p class="help" data-i18n="optionsTypoDictionaryHelp"></p>
          <label class="field">
            <span data-i18n="optionsSignatureKeywords"></span>
            <textarea id="signatureKeywords" rows="2" spellcheck="false"></textarea>
          </label>
          <p class="help" data-i18n="optionsSignatureHelp"></p>
        </div>
      </section>

      <section>
        <h2 data-i18n="optionsSectionLevels"></h2>
        <div class="content">
          <p class="help" data-i18n="optionsLevelsHelp"></p>
          <div id="warningLevels"></div>
        </div>
      </section>

      <section>
        <h2 data-i18n="optionsSectionAi"></h2>
        <div class="content">
          <p class="help" data-i18n="optionsAiHelp"></p>
          <label class="check">
            <input id="aiTypoCheckEnabled" type="checkbox" />
            <span data-i18n="optionsAiEnabled"></span>
          </label>
          <p id="aiStatus" class="state" role="status" aria-live="polite"></p>
          <button id="aiDownload" type="button" data-i18n="optionsAiDownload" hidden></button>
        </div>
      </section>

      <section>
        <h2 data-i18n="optionsSectionLedger"></h2>
        <div class="content">
          <p class="help" data-i18n="optionsLedgerHelp"></p>
          <label class="check">
            <input id="ledgerEnabled" type="checkbox" />
            <span data-i18n="optionsLedgerEnabled"></span>
          </label>
          <label class="check">
            <input id="ledgerReadReceived" type="checkbox" />
            <span data-i18n="optionsLedgerReadReceived"></span>
          </label>
          <p class="help" data-i18n="optionsLedgerReadReceivedHelp"></p>
          <label class="field">
            <span data-i18n="optionsLedgerRetention"></span>
            <select id="ledgerRetentionDays"></select>
          </label>
          <p id="ledgerStats" class="state" role="status" aria-live="polite"></p>
          <button id="ledgerManage" type="button" data-i18n="optionsLedgerManage"></button>
          <button
            id="ledgerClear"
            type="button"
            class="danger"
            data-i18n="optionsLedgerClear"
          ></button>
        </div>
      </section>

      <section>
        <h2 data-i18n="optionsSectionData"></h2>
        <div class="content">
          <button id="clear" type="button" class="danger" data-i18n="optionsClearData"></button>
        </div>
      </section>

      <div class="closing">
        <p class="notice" data-i18n="optionsUndoSendTip"></p>
      </div>
    </main>

    <div class="bar">
      <div class="bar-inner">
        <span id="status" class="status" role="status" aria-live="polite"></span>
        <button id="save" type="button" class="primary" data-i18n="optionsSave"></button>
      </div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
